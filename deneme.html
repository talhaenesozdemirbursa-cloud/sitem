<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayıt Ol</title>
    <style>
        /* Sayfanın genel stilini belirler */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f7f6; /* Arka plan rengi */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Kayıt formunun kutusunu (konteyner) şekillendirir */
        .kayit-konteyner {
            background-color: #ffffff; /* Beyaz kutu */
            padding: 40px;
            border-radius: 10px; /* Kenarları yuvarlak yapar */
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); /* Hafif gölge efekti */
            width: 100%;
            max-width: 400px; /* Kutunun maksimum genişliği */
            box-sizing: border-box;
        }

        /* Başlığı şekillendirir */
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
        }

        /* Form gruplarını (etiket + input) düzenler */
        .form-grup {
            margin-bottom: 20px;
        }

        /* Etiketleri (Ad Soyad, E-posta vb.) şekillendirir */
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: bold;
        }

        /* Bilgi giriş alanlarını (input) şekillendirir */
        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box; /* Padding ve border genişliğe dahil edilir */
        }

        /* Input alanına tıklandığında (focus) kenarlık rengini değiştirir */
        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus {
            border-color: #007bff;
            outline: none; /* Varsayılan mavi çerçeveyi kaldırır */
        }
        
        /* Kayıt Ol butonunu şekillendirir */
        .kayit-butonu {
            width: 100%;
            padding: 15px;
            background-color: #007bff; /* Mavi buton rengi */
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer; /* Üzerine gelince fare imlecini el yapar */
            transition: background-color 0.3s; /* Renk değişimini yumuşatır */
        }

        /* Butonun üzerine gelince rengini biraz koyulaştırır */
        .kayit-butonu:hover {
            background-color: #0056b3;
        }

        /* Formun altındaki giriş yapma linki */
        .giris-linki {
            text-align: center;
            margin-top: 20px;
            color: #777;
        }

        .giris-linki a {
            color: #007bff;
            text-decoration: none; /* Alt çizgiyi kaldırır */
        }

        .giris-linki a:hover {
            text-decoration: underline; /* Üzerine gelince alt çizgi ekler */
        }
    </style>
</head>
<body>

    <div class="kayit-konteyner">
        <h1>Hesap Oluştur</h1>
        <form action="/kayit-islemi" method="post">
            <div class="form-grup">
                <label for="adsoyad">Ad Soyad</label>
                <input type="text" id="adsoyad" name="adsoyad" placeholder="Adınızı ve soyadınızı girin" required>
            </div>
            
            <div class="form-grup">
                <label for="email">E-posta Adresi</label>
                <input type="email" id="email" name="email" placeholder="ornek@eposta.com" required>
            </div>

            <div class="form-grup">
                <label for="sifre">Şifre</label>
                <input type="password" id="sifre" name="sifre" placeholder="Güçlü bir şifre belirleyin" required>
            </div>

            <a href="anasayfasatin.html" class="kayit-butonu" style="display: block; text-align: center; text-decoration: none; box-sizing: border-box;">Kayıt Ol</a>

            <p class="giris-linki">
                Zaten bir hesabınız var mı? <a href="giris.html">Giriş Yap</a>
            </p>
        </form>
    </div>


</body>
</html>
